version: '3.8'

services:
  event-bus:
    build:
      context: .
      dockerfile: Dockerfile.service
    command: ["node", "services/event-bus/server.js"]
    ports:
      - "8086:8086"
    environment:
      - PORT=8086
    networks:
      - apex-banking-net

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.service
    command: ["node", "services/auth-service/server.js"]
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - EVENT_BUS_URL=http://event-bus:8086
    depends_on:
      - event-bus
    networks:
      - apex-banking-net

  account-service:
    build:
      context: .
      dockerfile: Dockerfile.service
    command: ["node", "services/account-service/server.js"]
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - EVENT_BUS_URL=http://event-bus:8086
    depends_on:
      - event-bus
    networks:
      - apex-banking-net

  fraud-service:
    build:
      context: .
      dockerfile: Dockerfile.service
    command: ["node", "services/fraud-service/server.js"]
    ports:
      - "8085:8085"
    environment:
      - PORT=8085
      - EVENT_BUS_URL=http://event-bus:8086
    depends_on:
      - event-bus
    networks:
      - apex-banking-net

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.service
    command: ["node", "services/notification-service/server.js"]
    ports:
      - "8084:8084"
    environment:
      - PORT=8084
      - EVENT_BUS_URL=http://event-bus:8086
    depends_on:
      - event-bus
    networks:
      - apex-banking-net

  transaction-service:
    build:
      context: .
      dockerfile: Dockerfile.service
    command: ["node", "services/transaction-service/server.js"]
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
      - ACCOUNT_SERVICE_URL=http://account-service:8082
      - FRAUD_SERVICE_URL=http://fraud-service:8085
      - EVENT_BUS_URL=http://event-bus:8086
    depends_on:
      - account-service
      - fraud-service
      - event-bus
    networks:
      - apex-banking-net

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.service
    command: ["node", "services/api-gateway/server.js"]
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - AUTH_SERVICE_URL=http://auth-service:8081
      - ACCOUNT_SERVICE_URL=http://account-service:8082
      - TRANSACTION_SERVICE_URL=http://transaction-service:8083
      - NOTIFICATION_SERVICE_URL=http://notification-service:8084
      - FRAUD_SERVICE_URL=http://fraud-service:8085
      - EVENT_BUS_URL=http://event-bus:8086
    depends_on:
      - auth-service
      - account-service
      - transaction-service
      - notification-service
      - fraud-service
      - event-bus
    networks:
      - apex-banking-net

networks:
  apex-banking-net:
    driver: bridge
